name: app_weather
description: "Weatherly — a weather forecast app using FastAPI + MongoDB + RapidAPI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.2
  share_plus: ^11.0.0
  image_picker: ^1.1.2

  # Date/time formatting (e.g. "Mon, 3 PM")
  intl: ^0.19.0

  # Professional-looking typography (Poppins) without bundling font files
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
